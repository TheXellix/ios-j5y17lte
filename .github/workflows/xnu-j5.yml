name: xnu-j5

# XNU 8796 (macOS 13.5 / iOS 16 era) for the Samsung SM-J530F (j5y17lte,
# Exynos7870, Cortex-A53). Reproduces the a5xelte build recipe on a GitHub
# macOS runner: donor patches 0001-0081 through darwin-xnu-build, then the
# Samsung series 0082+ via tools/a5xelte-apply-patches.py, then the J5 series
# in xnu/patches-j5/, an ARMv8.0 (no LSE) libfirehose, MACHINE_CONFIG=A5XELTE.

on:
  workflow_dispatch:
    inputs:
      through:
        description: last Samsung patch number to apply
        default: "227"
      runner:
        description: macOS runner image
        default: macos-15
  push:
    branches: [j5y17lte]
    paths:
      - "xnu/patches/**"
      - "xnu/patches-j5/**"
      - "tools/a5xelte-apply-patches.py"
      - "tools/a5xelte-build-firehose.sh"
      - ".github/workflows/xnu-j5.yml"

concurrency:
  group: xnu-j5-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: A5XELTE
  THROUGH: ${{ inputs.through || '227' }}

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and stage donor patches 0001-0081
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          for f in xnu/patches/*.patch xnu/patches/*.sh; do
            n=$(basename "$f" | cut -c1-4)
            if [ "$((10#$n))" -le 81 ]; then cp "$f" dxb/patches/; fi
          done
          ls dxb/patches
          # libfirehose_kernel is built arm64e-only upstream; the kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Hook Samsung + J5 patches and the A53 firehose into build.sh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxb/build.sh")
          s = p.read_text()
          hooks = '''
          j5_samsung_patches() {
              running "Samsung patches 0082-${THROUGH} and J5 patches"
              python3 "${GITHUB_WORKSPACE}/tools/a5xelte-apply-patches.py" "${WORK_DIR}/xnu" \\
                  --through "${THROUGH}" --receipt "${GITHUB_WORKSPACE}/out/samsung-receipt.json"
              if compgen -G "${GITHUB_WORKSPACE}/xnu/patches-j5/*.patch" > /dev/null; then
                  for PATCH in "${GITHUB_WORKSPACE}"/xnu/patches-j5/*.patch; do
                      running "J5 patch: ${PATCH}"
                      git -C "${WORK_DIR}/xnu" apply --recount "$PATCH"
                  done
              fi
              tar czf "${GITHUB_WORKSPACE}/out/xnu-src-patched.tgz" -C "${WORK_DIR}" --exclude=.git xnu
          }
          j5_firehose() {
              running "Rebuilding libfirehose_kernel for Cortex-A53 (no LSE)"
              bash "${GITHUB_WORKSPACE}/tools/a5xelte-build-firehose.sh" "${WORK_DIR}" "${GITHUB_WORKSPACE}/out/firehose"
          }
          '''
          anchor = "main() {"
          assert s.count(anchor) == 1
          s = s.replace(anchor, hooks + "\n" + anchor)
          for old, new in (("    patches\n", "    patches\n    j5_samsung_patches\n"),
                           ("    build_libdispatch\n", "    build_libdispatch\n    j5_firehose\n")):
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          mkdir -p out
          grep -n 'j5_' dxb/build.sh

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          # the debugger macros step calls a bare `python`
          mkdir -p "$HOME/bin" && ln -sf "$(command -v python3)" "$HOME/bin/python"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: dxb
        run: bash build.sh

      - name: Check kernel for ARMv8.1 LSE atomics
        if: always()
        run: |
          k=$(ls dxb/build/xnu.obj/kernel.development.a5xelte* 2>/dev/null | grep -v dSYM | head -1 || true)
          [ -n "$k" ] || { echo "no kernel produced"; exit 0; }
          xcrun llvm-objdump -d --no-show-raw-insn "$k" > out/kernel.disasm
          if grep -E $'\t(cas|casa|casal|casl|ldadd|ldclr|ldeor|ldset|swp)[a-z]*\t' out/kernel.disasm | head -20; then
            echo "::warning::LSE instructions present (Cortex-A53 has none)"
          fi

      - name: Collect
        if: always()
        run: |
          mkdir -p out/kernel
          cp -R dxb/fakeroot/System/Library/Kernels/. out/kernel/ 2>/dev/null || true
          cp dxb/build/xnu.obj/kernel.development.a5xelte* out/kernel/ 2>/dev/null || true
          (cd out/kernel && shasum -a 256 kernel.* > SHA256SUMS) || true
          rm -f out/kernel.disasm
          ls -laR out | head -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-j5
          path: out
          retention-days: 14

name: metal-ios

# Builds the on-device Metal/Mali toolchain for the j5y17lte (Mali-T830):
# metal2vulkan (AIR -> SPIR-V), SPIRV-Tools spirv-val, the Mesa 26.2.4
# Midgard backend and the A5MaliMetal provider bundle, all arm64 iOS 16.
# Only open-source inputs: no Apple shaders, captures or registries.

on:
  workflow_dispatch:
  push:
    branches: [j5y17lte]
    paths:
      - "userland/**"
      - ".github/workflows/metal-ios.yml"

concurrency:
  group: metal-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  M2V_REPO: https://github.com/steelbrain/metal2vulkan
  M2V_PIN: a2c440b8bcdcf20d34aa1694b61ae22c2a7ea68b
  MESA_URL: https://archive.mesa3d.org/mesa-26.2.4.tar.xz

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -eux
          ls -d /Applications/Xcode*.app
          # The provider uses MTLGPUAddress (iOS 26 SDK): pick the newest Xcode.
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$x"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install meson ninja mako pyyaml packaging
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios

      - name: Cache iOS toolchain outputs
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/out/air/metal2vulkan-ios
            ${{ runner.temp }}/out/air/metal2vulkan-host
            ${{ runner.temp }}/out/air/build-manifest.json
            ${{ runner.temp }}/out/spirv-val
            ${{ runner.temp }}/out/midgard/midgard
            ${{ runner.temp }}/out/midgard/midgard-generic602
            ${{ runner.temp }}/out/midgard/build-manifest.json
            ${{ runner.temp }}/mesa-26.2.4.tar.xz
            ${{ runner.temp }}/m2v-profile.json
          key: ios-toolchain-v1-${{ hashFiles('userland/a5xelte-air-translation/ios/build_*.py', 'userland/a5xelte-air-translation/ios/*.patch', 'userland/a5xelte-air-translation/spirv_pair_midgard.c', 'userland/a5xelte-air-translation/families/*.c', 'userland/a5xelte-air-translation/families/*.h', 'userland/a5xelte-air-translation/generic/*.h') }}

      - name: metal2vulkan (host + iOS)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone "$M2V_REPO" "$RUNNER_TEMP/m2v"
          git -C "$RUNNER_TEMP/m2v" checkout --detach "$M2V_PIN"
          (cd "$RUNNER_TEMP/m2v" && { [ -f Cargo.lock ] || cargo generate-lockfile; } && cargo fetch --locked)
          python3 userland/a5xelte-air-translation/ios/build_air_no_timeout.py \
            "$RUNNER_TEMP/m2v" "$RUNNER_TEMP/out/air"
          cp "$(find "$RUNNER_TEMP/m2v" -path '*validation/profiles/vk12-floor.json' | head -1)" "$RUNNER_TEMP/m2v-profile.json"

      - name: SPIRV-Tools spirv-val (iOS)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -eux
          python3 userland/a5xelte-air-translation/ios/build_spirv_tools_ios.py \
            --fetch --work-dir "$RUNNER_TEMP/spirv" --output "$RUNNER_TEMP/out/spirv-val"

      - name: Mesa Midgard backend (iOS)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o "$RUNNER_TEMP/mesa-26.2.4.tar.xz" "$MESA_URL"
          python3 userland/a5xelte-air-translation/ios/build_midgard_ios.py \
            "$RUNNER_TEMP/mesa-26.2.4.tar.xz" "$RUNNER_TEMP/out/midgard" --jobs 4

      - name: Save iOS toolchain cache
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/out/air/metal2vulkan-ios
            ${{ runner.temp }}/out/air/metal2vulkan-host
            ${{ runner.temp }}/out/air/build-manifest.json
            ${{ runner.temp }}/out/spirv-val
            ${{ runner.temp }}/out/midgard/midgard
            ${{ runner.temp }}/out/midgard/midgard-generic602
            ${{ runner.temp }}/out/midgard/build-manifest.json
            ${{ runner.temp }}/mesa-26.2.4.tar.xz
            ${{ runner.temp }}/m2v-profile.json
          key: ios-toolchain-v1-${{ hashFiles('userland/a5xelte-air-translation/ios/build_*.py', 'userland/a5xelte-air-translation/ios/*.patch', 'userland/a5xelte-air-translation/spirv_pair_midgard.c', 'userland/a5xelte-air-translation/families/*.c', 'userland/a5xelte-air-translation/families/*.h', 'userland/a5xelte-air-translation/generic/*.h') }}

      - name: Host Mesa template for the runtime encoders
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/hostmesa"
          tar -xf "$RUNNER_TEMP/mesa-26.2.4.tar.xz" -C "$RUNNER_TEMP/hostmesa"
          M="$RUNNER_TEMP/hostmesa/mesa-26.2.4"
          python3 - "$M" <<'PY'
          import sys, pathlib
          m = pathlib.Path(sys.argv[1])
          nir = m / 'src/compiler/nir/meson.build'
          t = nir.read_text()
          # Tools-only builds otherwise link the NIR stub: force the full NIR.
          i = t.index('\nif with_nir_headers_only')
          nir.write_text(t[:i] + '\nwith_nir_headers_only = false' + t[i:])
          pan = m / 'src/panfrost/meson.build'
          pan.write_text(pan.read_text() + '''
          a5_t720_copy_shader = executable(
            'a5_t720_copy_shader',
            files('a5_t720_copy_shader.c'),
            c_args : [c_msvc_compat_args, no_override_init_args, compile_args_panfrost],
            include_directories : [inc_include, inc_src, inc_panfrost],
            dependencies : [idep_nir, idep_mesautil, idep_pan_packers],
            link_with : [libpanfrost_compiler, libpanfrost_midgard_disasm],
            build_by_default : false,
          )
          ''')
          PY
          cp tools/a5xelte-gpu/gen-t720-copy-shader.c "$M/src/panfrost/a5_t720_copy_shader.c"
          (cd "$M" && CC=clang CXX=clang++ meson setup build-host -Dgallium-drivers= -Dvulkan-drivers= \
            -Dplatforms= -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dopengl=false \
            -Dllvm=disabled -Dgbm=disabled -Dtools=panfrost -Dzstd=disabled)
          ninja -C "$M/build-host" src/panfrost/a5_t720_copy_shader
          echo "HOST_MESA=$M/build-host" >> "$GITHUB_ENV"

      - name: A5MaliMetal provider bundle (T830 runtime encoders)
        run: |
          set -eux
          # Empty registry: enables the native render backend for the runtime-
          # linked dynamic stages (the T830 has no precompiled families).
          sh userland/a5mali-metal/StockMetalPlugin/build_local.sh "$RUNNER_TEMP/out/plugin" \
            --compiled-registry-dir userland/a5mali-metal/j5-registry \
            --mesa-build "$HOST_MESA"

      - name: Shader compiler service package (T830)
        run: |
          set -eux
          prof="$RUNNER_TEMP/m2v-profile.json"
          python3 tools/j5-package-compiler.py \
            "$RUNNER_TEMP/out/air/metal2vulkan-ios" "$RUNNER_TEMP/out/midgard/midgard" \
            "$RUNNER_TEMP/out/midgard/midgard-generic602" "$RUNNER_TEMP/out/spirv-val" \
            "$prof" "$RUNNER_TEMP/out/compiler"

      - name: Collect
        if: always()
        run: |
          set -x
          mkdir -p artifact
          for d in air midgard plugin compiler; do
            [ -d "$RUNNER_TEMP/out/$d" ] && rsync -a --exclude source --exclude cargo-target \
              --exclude src --exclude build "$RUNNER_TEMP/out/$d" artifact/ || true
          done
          cp "$RUNNER_TEMP/out/spirv-val" artifact/ 2>/dev/null || true
          find artifact -maxdepth 3 -type f | head -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-ios
          path: artifact
